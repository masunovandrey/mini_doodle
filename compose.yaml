services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task1
      POSTGRES_USER: task1
      POSTGRES_PASSWORD: task1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task1 -d task1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task1
      SPRING_DATASOURCE_USERNAME: task1
      SPRING_DATASOURCE_PASSWORD: task1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q \"\\\"UP\\\"\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
