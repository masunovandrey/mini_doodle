spring.application.name=task1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Operational visibility: only the health endpoint is exposed to the local
# Compose deployment. Servlet-type probes expose /actuator/health/liveness and
# /actuator/health/readiness groups used by the Compose healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
